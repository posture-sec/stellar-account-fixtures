# Tests, lint, types and the corpus check (task 1.3).
#
# Both actions are pinned by commit SHA, with the tag that SHA was resolved from in the
# comment. A SHA pin is only honest if somebody read the diff, and the comment is the only
# record of which commit was read. The two dev tools are pinned in requirements-dev.txt so a
# hosted run tests the same thing the laptop that wrote the change tested.
#
# This run is the evidence for 1.3 and for gate G1. Until it is green on GitHub those lines
# stay unticked whatever the local output says, and a green run here is not branch protection:
# 1.2 is the task that makes these checks required.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: ci / python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # The floor rather than the newest: tomllib is 3.11 and this is the version a
          # consumer of the corpus is most likely to run.
          python-version: "3.11"

      - name: Install the dev tools
        run: python -m pip install --quiet -r requirements-dev.txt

      # The product first: a sidecar that no longer describes its capture fails the build
      # before any test runs, because that is the failure this repository exists to catch.
      - name: Corpus against its own sidecars
        run: python validate.py

      - name: Tests
        # Both suites, named: default discovery starts at the repository root and skips a
        # directory that is not a package, so a tests/ tree nobody names here is a suite
        # that never runs rather than a suite that fails.
        run: |
          python -m unittest test_validate
          python -m unittest discover -s tests -t tests

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Types
        run: mypy

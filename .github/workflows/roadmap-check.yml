# The roadmap gate (task 1.4). Two failures it has to catch, both of which happened in this
# org on hand-maintained tables: a pull request that changes files and leaves ROADMAP.md
# alone, and a pull request that edits the checklist while leaving the derived progress table
# or the Last updated line behind. The table is generated by scripts/roadmap_progress.py, so a
# row that disagrees with the task lines is a row nobody regenerated.
#
# Gate G4 is not this workflow existing. It is the observed probe: one pull request that drops
# the roadmap edit and fails on GitHub, recorded with its date in ROADMAP.md.

name: roadmap-check

on:
  pull_request:

permissions:
  contents: read

jobs:
  roadmap:
    name: roadmap-check / gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull_request checkout is detached at the merge ref with no base branch, so the
          # gate would have nothing to diff against.
          fetch-depth: 0

      - name: ROADMAP.md touched in the same change
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "${GITHUB_BASE_REF}"
          scripts/check_roadmap_touched.sh "origin/${GITHUB_BASE_REF}"

      - name: Progress table agrees with the task lines
        run: python3 scripts/roadmap_progress.py --check ROADMAP.md

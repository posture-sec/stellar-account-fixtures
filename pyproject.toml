# Tool configuration only. This repository is a data corpus plus two stdlib
# scripts: there is no package to build and nothing here to install.
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["validate.py", "tools/capture.py", "test_validate.py", "tests/test_roadmap_gate.py"]
check_untyped_defs = true

# Tool configuration only. This repository is a data corpus plus two stdlib
# scripts: there is no package to build and nothing here to install.
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = [
    "validate.py",
    "tools/capture.py",
    "test_validate.py",
    "tests/test_corpus_account_links.py",
    "tests/test_corpus_balances.py",
    "tests/test_corpus_directory_readme.py",
    "tests/test_corpus_fixtures_index.py",
    "tests/test_corpus_provenance.py",
    "tests/test_corpus_shape_matrix.py",
    "tests/test_corpus_signers.py",
    "tests/test_corpus_thresholds.py",
    "tests/test_roadmap_gate.py",
    "tests/test_schema_scenario_bounds.py",
    "tests/test_schema_shape_duplicates.py",
    "tests/test_schema_source_host.py",
    "tests/test_schema_version_gate.py",
    "tests/test_validate_schema_root_contract.py",
    "tests/test_validate_schema_shape_table.py",
]
check_untyped_defs = true
